name: financeiro

x-php: &php
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: financeiro-php:dev
  volumes:
    - ./api:/var/www/api
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: secret
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro"]
      interval: 2s
      timeout: 3s
      retries: 30

  php:
    <<: *php

  worker:
    <<: *php
    command: php artisan queue:work --tries=3
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COREPACK_HOME: /tmp/corepack
      NUXT_TELEMETRY_DISABLED: "1"
      npm_config_store_dir: /app/node_modules/.pnpm-store
    volumes:
      - ./web:/app
    command: sh -c "corepack pnpm install && corepack pnpm dev --host 0.0.0.0 --port 3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/api:ro
    depends_on:
      - php
      - web

volumes:
  pgdata:
